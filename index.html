
<!doctype html>
<html>
<body>
<pre id="out">Starting test...</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  try {
    const r = await fetch("file:///challenge/", {
      cache: "no-store"
    });
    out.textContent = "Directory response: " + r.status +
      "\n" + (await r.text()).slice(0, 4000);
  } catch (e) {
    out.textContent = "File access failed: " + e;
  }
})();
</script>
</body>
</html>
